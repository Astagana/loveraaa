name: Build APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Link website Vercel Anda, contoh https://lovera.vercel.app"
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan project Capacitor
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p www && echo '<!doctype html><title>Lovera</title>' > www/index.html
          echo "{\"appId\":\"com.lovera.app\",\"appName\":\"Lovera\",\"webDir\":\"www\",\"server\":{\"url\":\"$SITE\",\"androidScheme\":\"https\"}}" > capacitor.config.json
          npm init -y > /dev/null
          test -f google-services.json || { echo 'google-services.json belum ada di folder utama repo'; exit 1; }
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          npx cap add android
      - name: Izin dan ikon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done
          cp google-services.json android/app/google-services.json
          grep -q 'gms:google-services' android/build.gradle || sed -i "s#classpath 'com.android.tools.build:gradle:[^']*'#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          grep -q 'google-services' android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          mkdir -p $R/drawable $R/values
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,21s-7,-4.5 -9.5,-9A5.5,5.5 0 0 1 12,6a5.5,5.5 0 0 1 9.5,6c-2.5,4.5 -9.5,9 -9.5,9z"/></vector>' > $R/drawable/ic_stat.xml
          echo '<resources><color name="lovera_accent">#FF6B57</color></resources>' > $R/values/lovera_colors.xml
          sed -i 's#</application>#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/lovera_accent"/></application>#' $M
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Simpan lovera.apk ke repo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lovera.apk
          git config user.name "lovera-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lovera.apk
          git commit -m "Update lovera.apk" || echo "tidak ada perubahan"
          git push
          
