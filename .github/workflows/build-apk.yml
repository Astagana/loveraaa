name: Build APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Link website Vercel Anda, contoh https://lovera.vercel.app"
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan project Capacitor
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p www && echo '<!doctype html><title>Lovera</title>' > www/index.html
          echo "{\"appId\":\"com.lovera.app\",\"appName\":\"Lovera\",\"webDir\":\"www\",\"server\":{\"url\":\"$SITE\",\"androidScheme\":\"https\"}}" > capacitor.config.json
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
      - name: Izin dan ikon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Simpan lovera.apk ke repo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lovera.apk
          git config user.name "lovera-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lovera.apk
          git commit -m "Update lovera.apk" || echo "tidak ada perubahan"
          git push
          
